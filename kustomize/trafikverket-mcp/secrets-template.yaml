# Optional – only needed if you want a shared server-side Trafikverket key (Intric auth mode "None").
# With Intric auth mode "API key" the key is pasted in Intric instead and no secret is required here.
apiVersion: v1
kind: Secret
metadata:
  name: trafikverket-mcp-secrets
  namespace: mcp
type: Opaque
stringData:
  TRAFIKVERKET_API_KEY: ""
