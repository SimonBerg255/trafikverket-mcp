# Exposes the server at https://mcp-servers.intric.ai/trafikverket/mcp
# The app itself serves /mcp and /health at the root, so the /trafikverket prefix is stripped.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: trafikverket-mcp
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"   # SSE / long tool calls
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
spec:
  ingressClassName: nginx
  rules:
    - host: mcp-servers.intric.ai
      http:
        paths:
          - path: /trafikverket(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: trafikverket-mcp
                port: { number: 80 }
